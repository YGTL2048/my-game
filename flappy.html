<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>大肥鱼海底历险记</title>
    <style>
        body {
            background: linear-gradient(to bottom, #0b1d3a, #1a3b5c);
            color: #e0e6ed; font-family: sans-serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 100dvh; margin: 0; padding: 0; box-sizing: border-box;
            overflow: hidden; touch-action: none; user-select: none;
        }
        .difficulty-bar {
            display: flex; gap: 5px; margin-bottom: 5px; width: 100%; max-width: 400px;
            justify-content: center;
        }
        .diff-btn {
            flex: 1; padding: 8px 0; font-size: 13px; font-weight: bold;
            background: #1c2229; color: #8fa0b4; border: 1px solid #3b4654;
            border-radius: 5px; cursor: pointer; transition: all 0.2s;
        }
        .diff-btn.active { background: #00bcd4; color: white; border-color: #00bcd4; }
        .game-container {
            position: relative; width: 100%; max-width: 400px;
            height: 75dvh; max-height: 650px; border-radius: 12px;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #3b4654;
        }
        canvas { display: block; width: 100%; height: 100%; }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.6); z-index: 10; text-align: center;
        }
        .overlay h1 { font-size: 24px; color: #00f0f0; margin-bottom: 10px; }
        .overlay p { font-size: 16px; margin: 5px 0; color: #ccddee; }
        .btn {
            margin-top: 20px; padding: 12px 30px; font-size: 18px; font-weight: bold;
            background: #00bcd4; color: white; border: none; border-radius: 8px;
            cursor: pointer; box-shadow: 0 4px 0 #008ba3; transition: all 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #008ba3; }
        #score-board {
            position: absolute; top: 15px; left: 15px;
            font-size: 24px; font-weight: bold; color: #ffcc00;
            text-shadow: 2px 2px 0 #000; z-index: 5;
        }
    </style>
</head>
<body>

<div class="difficulty-bar" id="diffBar">
    <button class="diff-btn" data-diff="0">简单</button>
    <button class="diff-btn active" data-diff="1">普通</button>
    <button class="diff-btn" data-diff="2">困难</button>
    <button class="diff-btn" data-diff="3">地狱</button>
</div>

<div class="game-container">
    <div id="score-board">得分: 0</div>
    <canvas id="gameCanvas"></canvas>
    
    <div class="overlay" id="startOverlay">
        <h1>🐟 大肥鱼海底历险记</h1>
        <p>点击屏幕控制大肥鱼上浮</p>
        <p>躲避珊瑚，吃白饭加分</p>
        <button class="btn" id="startBtn">开始游戏</button>
    </div>
    
    <div class="overlay" id="overOverlay" style="display: none;">
        <h1>Game Over</h1>
        <p id="finalScore">最终得分: 0</p>
        <button class="btn" id="restartBtn">再来一局</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreBoard = document.getElementById('score-board');
    const startOverlay = document.getElementById('startOverlay');
    const overOverlay = document.getElementById('overOverlay');
    const finalScoreEl = document.getElementById('finalScore');

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 难度配置：[重力, 跳跃力, 障碍生成间隔(帧)]
    // 困难：沿用了上一版的地狱参数。地狱：速度拉满，间隔更短，更变态！
    const DIFFICULTY = [
        { gravity: 0.12, jump: -3.8, spawn: 130, label: '简单' },
        { gravity: 0.18, jump: -4.8, spawn: 110, label: '普通' },
        { gravity: 0.35, jump: -6.5, spawn: 80, label: '困难' }, // 旧地狱
        { gravity: 0.50, jump: -8.5, spawn: 55, label: '地狱' }  // 新地狱：更快更难！
    ];
    let diffIndex = 1; // 默认普通

    let gameState = 'idle'; // idle, playing, over
    let score = 0;
    
    const fish = {
        x: 80,
        y: canvas.height / 2,
        radius: 12, 
        vy: 0,
        rotation: 0
    };

    let obstacles = [];
    let riceGrains = [];
    let bubbles = [];
    let frameCount = 0;

    for (let i = 0; i < 20; i++) {
        bubbles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 5 + 2,
            speed: Math.random() * 1 + 0.5
        });
    }

    document.querySelectorAll('.diff-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            diffIndex = parseInt(btn.dataset.diff);
        });
    });

    function initGame() {
        resizeCanvas();
        fish.y = canvas.height / 2;
        fish.vy = 0;
        fish.rotation = 0;
        score = 0;
        scoreBoard.innerText = `得分: ${score}`;
        obstacles = [];
        riceGrains = [];
        frameCount = 0;
        gameState = 'playing';
        startOverlay.style.display = 'none';
        overOverlay.style.display = 'none';
    }

    function jump() {
        if (gameState === 'idle') {
            initGame();
        } else if (gameState === 'playing') {
            fish.vy = DIFFICULTY[diffIndex].jump;
        }
    }

    document.addEventListener('touchstart', (e) => {
        if (e.target.closest('button') || e.target.closest('.overlay') || e.target.closest('.difficulty-bar')) return;
        e.preventDefault(); jump(); 
    }, { passive: false });

    document.addEventListener('mousedown', (e) => {
        if (e.target.closest('button') || e.target.closest('.overlay') || e.target.closest('.difficulty-bar')) return;
        e.preventDefault(); jump(); 
    });

    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    
    startBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); initGame(); }, { passive: false });
    startBtn.addEventListener('click', (e) => { e.stopPropagation(); initGame(); });
    
    restartBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); initGame(); }, { passive: false });
    restartBtn.addEventListener('click', (e) => { e.stopPropagation(); initGame(); });

    function update() {
        if (gameState === 'playing') {
            frameCount++;
            
            fish.vy += DIFFICULTY[diffIndex].gravity;
            fish.y += fish.vy;
            fish.rotation = Math.min(Math.max(fish.vy * 0.04, -0.3), 0.4);

            if (fish.y - fish.radius < 0 || fish.y + fish.radius > canvas.height) {
                gameOver();
            }

            if (frameCount % DIFFICULTY[diffIndex].spawn === 0) {
                let gap = Math.max(170, canvas.height * 0.28); 
                let minTop = 50; 
                let maxTop = canvas.height - gap - 50; 
                if (maxTop < minTop) maxTop = minTop; 
                
                let topHeight = Math.random() * (maxTop - minTop) + minTop;
                
                obstacles.push({
                    x: canvas.width,
                    topHeight: topHeight,
                    bottomY: topHeight + gap,
                    width: 50,
                    passed: false
                });

                riceGrains.push({
                    x: canvas.width + 25,
                    y: topHeight + gap / 2 + (Math.random() * 30 - 15),
                    radius: 8,
                    collected: false
                });
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                // 地狱难度下障碍物移动速度也略微加快
                let speedMultiplier = diffIndex === 3 ? 3.5 : 2.5;
                obs.x -= speedMultiplier; 
                
                let fishLeft = fish.x - fish.radius;
                let fishRight = fish.x + fish.radius;
                let fishTop = fish.y - fish.radius;
                let fishBottom = fish.y + fish.radius;

                if (fishRight > obs.x && fishLeft < obs.x + obs.width) {
                    if (fishTop < obs.topHeight || fishBottom > obs.bottomY) {
                        gameOver();
                    }
                }

                if (!obs.passed && obs.x + obs.width < fish.x - fish.radius) {
                    obs.passed = true;
                    score += 1;
                    scoreBoard.innerText = `得分: ${score}`;
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            for (let i = riceGrains.length - 1; i >= 0; i--) {
                let rice = riceGrains[i];
                let speedMultiplier = diffIndex === 3 ? 3.5 : 2.5;
                rice.x -= speedMultiplier;

                if (!rice.collected) {
                    let dx = fish.x - rice.x;
                    let dy = fish.y - rice.y;
                    if (Math.sqrt(dx * dx + dy * dy) < fish.radius + rice.radius) {
                        rice.collected = true;
                        score += 5;
                        scoreBoard.innerText = `得分: ${score}`;
                    }
                }

                if (rice.x + rice.radius < 0) {
                    riceGrains.splice(i, 1);
                }
            }

            bubbles.forEach(b => {
                b.y -= b.speed;
                if (b.y < 0) { b.y = canvas.height; b.x = Math.random() * canvas.width; }
            });
        }

        draw();
        requestAnimationFrame(update);
    }

    function gameOver() {
        gameState = 'over';
        finalScoreEl.innerText = `最终得分: ${score}`;
        overOverlay.style.display = 'flex';
    }

    function draw() {
        ctx.fillStyle = '#0b1d3a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.beginPath();
        ctx.moveTo(canvas.width * 0.2, 0); ctx.lineTo(canvas.width * 0.5, canvas.height);
        ctx.lineTo(canvas.width * 0.8, canvas.height); ctx.lineTo(canvas.width * 0.5, 0);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)'; ctx.lineWidth = 1;
        bubbles.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke(); });

        obstacles.forEach(obs => {
            drawCoral(obs.x, 0, obs.width, obs.topHeight, true);
            drawCoral(obs.x, obs.bottomY, obs.width, canvas.height - obs.bottomY, false);
        });

        riceGrains.forEach(rice => {
            if (!rice.collected) {
                ctx.fillStyle = '#ffffff'; ctx.beginPath();
                ctx.arc(rice.x, rice.y, rice.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(200, 230, 255, 0.8)'; ctx.beginPath();
                ctx.arc(rice.x - 2, rice.y - 2, rice.radius * 0.4, 0, Math.PI * 2); ctx.fill();
            }
        });

        if (gameState !== 'idle') {
            drawPixelFish(fish.x, fish.y, fish.rotation);
        }
    }

    function drawPixelFish(x, y, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        
        const p = 2; 
        const cHair = '#3d6baf'; 
        const cHairLight = '#5b9bd5'; 
        const cHeadWear = '#ffffff'; 
        const cFace = '#ffd7b5'; 
        const cEye = '#000000'; 
        const cDress = '#232a33'; 
        const cApron = '#ffffff'; 
        const cTail = '#4a8ab5'; 

        ctx.fillStyle = cTail;
        ctx.fillRect(-12 * p, -4 * p, 4 * p, 2 * p);
        ctx.fillRect(-12 * p, 2 * p, 4 * p, 2 * p);
        ctx.fillRect(-14 * p, -2 * p, 4 * p, 4 * p);

        ctx.fillStyle = cHair;
        ctx.fillRect(-6 * p, -6 * p, 12 * p, 12 * p);

        ctx.fillStyle = cDress;
        ctx.fillRect(-6 * p, 2 * p, 10 * p, 4 * p);
        
        ctx.fillStyle = cApron;
        ctx.fillRect(-4 * p, 3 * p, 8 * p, 3 * p);
        ctx.fillStyle = cHairLight;
        ctx.fillRect(0, 4 * p, 2 * p, 1 * p);

        ctx.fillStyle = cFace;
        ctx.fillRect(2 * p, -4 * p, 8 * p, 8 * p);

        ctx.fillStyle = '#ff9999';
        ctx.fillRect(1 * p, 0, 2 * p, 2 * p);

        ctx.fillStyle = cEye;
        ctx.fillRect(5 * p, -2 * p, 2 * p, 3 * p);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(5 * p, -2 * p, 1 * p, 1 * p);

        ctx.fillStyle = cHair;
        ctx.fillRect(1 * p, -6 * p, 9 * p, 3 * p);
        ctx.fillRect(1 * p, -3 * p, 2 * p, 3 * p);

        ctx.fillStyle = cHeadWear;
        ctx.fillRect(1 * p, -8 * p, 8 * p, 2 * p); 
        for(let i = 1; i <= 7; i+=2) {
            ctx.fillRect(i * p, -9 * p, 1 * p, 1 * p);
        }

        ctx.fillStyle = cHairLight;
        ctx.fillRect(-2 * p, -5 * p, 2 * p, 3 * p);

        ctx.fillStyle = cTail;
        ctx.fillRect(-10 * p, -1 * p, 2 * p, 2 * p);

        ctx.restore();
    }

    function drawCoral(x, y, w, h, isTop) {
        ctx.fillStyle = isTop ? '#ff6b6b' : '#4ecdc4'; 
        ctx.beginPath(); ctx.roundRect(x, y, w, h, [10]); ctx.fill();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        if (isTop) {
            ctx.fillRect(x + 10, y + 10, 10, h - 20);
            ctx.fillRect(x + 30, y + 30, 8, h - 40);
        } else {
            ctx.fillRect(x + 10, y + 10, 10, h - 20);
            ctx.fillRect(x + 30, y + 20, 8, h - 30);
        }
        ctx.fillStyle = isTop ? '#ff9f9f' : '#85e3dd';
        for (let i = 0; i < h; i += 30) {
            ctx.beginPath(); ctx.arc(x + (isTop ? w : 0), y + i, 6, 0, Math.PI * 2); ctx.fill();
        }
    }

    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.beginPath(); this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
            this.closePath(); return this;
        };
    }

    update();
</script>
</body>
</html>
