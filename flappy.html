<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>大肥鱼海底历险记</title>
    <style>
        body {
            background: linear-gradient(to bottom, #0b1d3a, #1a3b5c);
            color: #e0e6ed; font-family: sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100dvh; margin: 0; padding: 0; box-sizing: border-box;
            overflow: hidden; touch-action: none; user-select: none;
        }
        .game-container {
            position: relative; width: 100%; max-width: 400px;
            height: 80dvh; max-height: 700px; border-radius: 12px;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #3b4654;
        }
        canvas {
            display: block; width: 100%; height: 100%;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.6); z-index: 10; text-align: center;
        }
        .overlay h1 { font-size: 24px; color: #00f0f0; margin-bottom: 10px; }
        .overlay p { font-size: 16px; margin: 5px 0; color: #ccddee; }
        .btn {
            margin-top: 20px; padding: 12px 30px; font-size: 18px; font-weight: bold;
            background: #00bcd4; color: white; border: none; border-radius: 8px;
            cursor: pointer; box-shadow: 0 4px 0 #008ba3; transition: all 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #008ba3; }
        #score-board {
            position: absolute; top: 15px; left: 15px;
            font-size: 24px; font-weight: bold; color: #ffcc00;
            text-shadow: 2px 2px 0 #000; z-index: 5;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div id="score-board">得分: 0</div>
    <canvas id="gameCanvas"></canvas>
    
    <div class="overlay" id="startOverlay">
        <h1>🐟 大肥鱼海底历险记</h1>
        <p>点击屏幕控制大肥鱼上浮</p>
        <p>躲避珊瑚，吃白饭加分</p>
        <button class="btn" id="startBtn">开始游戏</button>
    </div>
    
    <div class="overlay" id="overOverlay" style="display: none;">
        <h1>Game Over</h1>
        <p id="finalScore">最终得分: 0</p>
        <button class="btn" id="restartBtn">再来一局</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreBoard = document.getElementById('score-board');
    const startOverlay = document.getElementById('startOverlay');
    const overOverlay = document.getElementById('overOverlay');
    const finalScoreEl = document.getElementById('finalScore');

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let gameState = 'idle'; 
    let score = 0;
    
    const fish = {
        x: 80,
        y: canvas.height / 2,
        radius: 15,
        vy: 0,
        gravity: 0.4,
        jump: -6.5,
        rotation: 0
    };

    let obstacles = [];
    let riceGrains = [];
    let bubbles = [];
    let frameCount = 0;
    let spawnInterval = 90; 

    for (let i = 0; i < 20; i++) {
        bubbles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 5 + 2,
            speed: Math.random() * 1 + 0.5
        });
    }

    function initGame() {
        resizeCanvas();
        fish.y = canvas.height / 2;
        fish.vy = 0;
        fish.rotation = 0;
        score = 0;
        scoreBoard.innerText = `得分: ${score}`;
        obstacles = [];
        riceGrains = [];
        frameCount = 0;
        gameState = 'playing';
        startOverlay.style.display = 'none';
        overOverlay.style.display = 'none';
    }

    function jump() {
        if (gameState === 'idle') {
            initGame();
        } else if (gameState === 'playing') {
            fish.vy = fish.jump;
        }
    }

    // 修复：全局触摸事件拦截了按钮点击
    document.addEventListener('touchstart', (e) => {
        // 如果点击的是按钮或遮罩层，不要拦截，交给按钮自己的事件处理
        if (e.target.closest('button') || e.target.closest('.overlay')) return;
        e.preventDefault(); 
        jump(); 
    }, { passive: false });

    document.addEventListener('mousedown', (e) => {
        if (e.target.closest('button') || e.target.closest('.overlay')) return;
        e.preventDefault(); 
        jump(); 
    });

    // 专门为按钮绑定触摸和点击事件，并阻止冒泡
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    
    startBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); initGame(); }, { passive: false });
    startBtn.addEventListener('click', (e) => { e.stopPropagation(); initGame(); });
    
    restartBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); initGame(); }, { passive: false });
    restartBtn.addEventListener('click', (e) => { e.stopPropagation(); initGame(); });

    function update() {
        if (gameState === 'playing') {
            frameCount++;
            
            fish.vy += fish.gravity;
            fish.y += fish.vy;
            
            fish.rotation = Math.min(Math.max(fish.vy * 0.05, -0.4), 0.5);

            if (fish.y - fish.radius < 0 || fish.y + fish.radius > canvas.height) {
                gameOver();
            }

            if (frameCount % spawnInterval === 0) {
                let gap = 140; 
                let topHeight = Math.random() * (canvas.height - gap - 100) + 50;
                
                obstacles.push({
                    x: canvas.width,
                    topHeight: topHeight,
                    bottomY: topHeight + gap,
                    width: 50,
                    passed: false
                });

                riceGrains.push({
                    x: canvas.width + 25,
                    y: topHeight + gap / 2 + (Math.random() * 40 - 20),
                    radius: 8,
                    collected: false
                });
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= 2; 
                
                let fishLeft = fish.x - fish.radius;
                let fishRight = fish.x + fish.radius;
                let fishTop = fish.y - fish.radius;
                let fishBottom = fish.y + fish.radius;

                if (fishRight > obs.x && fishLeft < obs.x + obs.width) {
                    if (fishTop < obs.topHeight || fishBottom > obs.bottomY) {
                        gameOver();
                    }
                }

                if (!obs.passed && obs.x + obs.width < fish.x - fish.radius) {
                    obs.passed = true;
                    score += 1;
                    scoreBoard.innerText = `得分: ${score}`;
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            for (let i = riceGrains.length - 1; i >= 0; i--) {
                let rice = riceGrains[i];
                rice.x -= 2;

                if (!rice.collected) {
                    let dx = fish.x - rice.x;
                    let dy = fish.y - rice.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < fish.radius + rice.radius) {
                        rice.collected = true;
                        score += 5;
                        scoreBoard.innerText = `得分: ${score}`;
                    }
                }

                if (rice.x + rice.radius < 0) {
                    riceGrains.splice(i, 1);
                }
            }

            bubbles.forEach(b => {
                b.y -= b.speed;
                if (b.y < 0) {
                    b.y = canvas.height;
                    b.x = Math.random() * canvas.width;
                }
            });
        }

        draw();
        requestAnimationFrame(update);
    }

    function gameOver() {
        gameState = 'over';
        finalScoreEl.innerText = `最终得分: ${score}`;
        overOverlay.style.display = 'flex';
    }

    function draw() {
        ctx.fillStyle = '#0b1d3a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.beginPath();
        ctx.moveTo(canvas.width * 0.2, 0);
        ctx.lineTo(canvas.width * 0.5, canvas.height);
        ctx.lineTo(canvas.width * 0.8, canvas.height);
        ctx.lineTo(canvas.width * 0.5, 0);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1;
        bubbles.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.stroke();
        });

        obstacles.forEach(obs => {
            drawCoral(obs.x, 0, obs.width, obs.topHeight, true);
            drawCoral(obs.x, obs.bottomY, obs.width, canvas.height - obs.bottomY, false);
        });

        riceGrains.forEach(rice => {
            if (!rice.collected) {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(rice.x, rice.y, rice.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(200, 230, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(rice.x - 2, rice.y - 2, rice.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        if (gameState !== 'idle') {
            drawFish(fish.x, fish.y, fish.radius, fish.rotation);
        }
    }

    function drawCoral(x, y, w, h, isTop) {
        ctx.fillStyle = isTop ? '#ff6b6b' : '#4ecdc4'; 
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, [10]);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        if (isTop) {
            ctx.fillRect(x + 10, y + 10, 10, h - 20);
            ctx.fillRect(x + 30, y + 30, 8, h - 40);
        } else {
            ctx.fillRect(x + 10, y + 10, 10, h - 20);
            ctx.fillRect(x + 30, y + 20, 8, h - 30);
        }

        ctx.fillStyle = isTop ? '#ff9f9f' : '#85e3dd';
        for (let i = 0; i < h; i += 30) {
            ctx.beginPath();
            ctx.arc(x + (isTop ? w : 0), y + i, 6, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawFish(x, y, r, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);

        ctx.fillStyle = '#5b9bd5';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#3b4654';
        ctx.beginPath();
        ctx.moveTo(-r * 0.5, -r * 0.8);
        ctx.lineTo(-r * 1.2, -r * 1.3);
        ctx.lineTo(0, -r * 0.5);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-r * 0.5, r * 0.8);
        ctx.lineTo(-r * 1.2, r * 1.3);
        ctx.lineTo(0, r * 0.5);
        ctx.fill();

        ctx.fillStyle = '#4a8ab5';
        ctx.beginPath();
        ctx.moveTo(-r, 0);
        ctx.lineTo(-r * 1.6, -r * 0.5);
        ctx.lineTo(-r * 1.6, r * 0.5);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(r * 0.3, -r * 0.2, r * 0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(r * 0.4, -r * 0.2, r * 0.15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 100, 100, 0.4)';
        ctx.beginPath();
        ctx.arc(r * 0.1, r * 0.3, r * 0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.beginPath();
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            this.closePath();
            return this;
        };
    }

    update();
</script>
</body>
</html>
