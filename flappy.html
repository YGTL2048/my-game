<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>大肥鱼海底历险记</title>
    <style>
        body {
            background: linear-gradient(to bottom, #0b1d3a, #1a3b5c);
            color: #e0e6ed; font-family: sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100dvh; margin: 0; padding: 0; box-sizing: border-box;
            overflow: hidden; touch-action: none; user-select: none;
        }
        .game-container {
            position: relative; width: 100%; max-width: 400px;
            height: 80dvh; max-height: 700px; border-radius: 12px;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 2px solid #3b4654;
        }
        canvas {
            display: block; width: 100%; height: 100%;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.6); z-index: 10; text-align: center;
        }
        .overlay h1 { font-size: 24px; color: #00f0f0; margin-bottom: 10px; }
        .overlay p { font-size: 16px; margin: 5px 0; color: #ccddee; }
        .btn {
            margin-top: 20px; padding: 12px 30px; font-size: 18px; font-weight: bold;
            background: #00bcd4; color: white; border: none; border-radius: 8px;
            cursor: pointer; box-shadow: 0 4px 0 #008ba3; transition: all 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #008ba3; }
        #score-board {
            position: absolute; top: 15px; left: 15px;
            font-size: 24px; font-weight: bold; color: #ffcc00;
            text-shadow: 2px 2px 0 #000; z-index: 5;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div id="score-board">得分: 0</div>
    <canvas id="gameCanvas"></canvas>
    
    <div class="overlay" id="startOverlay">
        <h1>🐟 大肥鱼海底历险记</h1>
        <p>点击屏幕控制大肥鱼上浮</p>
        <p>躲避珊瑚，吃白饭加分</p>
        <button class="btn" id="startBtn">开始游戏</button>
    </div>
    
    <div class="overlay" id="overOverlay" style="display: none;">
        <h1>Game Over</h1>
        <p id="finalScore">最终得分: 0</p>
        <button class="btn" id="restartBtn">再来一局</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreBoard = document.getElementById('score-board');
    const startOverlay = document.getElementById('startOverlay');
    const overOverlay = document.getElementById('overOverlay');
    const finalScoreEl = document.getElementById('finalScore');

    // 设置画布尺寸
    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 游戏状态
    let gameState = 'idle'; // idle, playing, over
    let score = 0;
    
    // 大肥鱼物理参数
    const fish = {
        x: 80,
        y: canvas.height / 2,
        radius: 15,
        vy: 0,
        gravity: 0.4,
        jump: -6.5,
        rotation: 0
    };

    // 障碍物、白饭、背景气泡
    let obstacles = [];
    let riceGrains = [];
    let bubbles = [];
    
    // 计时器
    let frameCount = 0;
    let spawnInterval = 90; // 大约 1.5 秒生成一个障碍

    // 初始化气泡背景
    for (let i = 0; i < 20; i++) {
        bubbles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 5 + 2,
            speed: Math.random() * 1 + 0.5
        });
    }

    function initGame() {
        resizeCanvas();
        fish.y = canvas.height / 2;
        fish.vy = 0;
        fish.rotation = 0;
        score = 0;
        scoreBoard.innerText = `得分: ${score}`;
        obstacles = [];
        riceGrains = [];
        frameCount = 0;
        gameState = 'playing';
        startOverlay.style.display = 'none';
        overOverlay.style.display = 'none';
    }

    function jump() {
        if (gameState === 'idle') {
            initGame();
        } else if (gameState === 'playing') {
            fish.vy = fish.jump;
        }
    }

    // 触摸或点击屏幕
    document.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); }, { passive: false });
    document.addEventListener('mousedown', (e) => { e.preventDefault(); jump(); });
    document.getElementById('startBtn').addEventListener('click', (e) => { e.stopPropagation(); initGame(); });
    document.getElementById('restartBtn').addEventListener('click', (e) => { e.stopPropagation(); initGame(); });

    // 游戏循环
    function update() {
        if (gameState === 'playing') {
            frameCount++;
            
            // 大肥鱼物理
            fish.vy += fish.gravity;
            fish.y += fish.vy;
            
            // 大肥鱼旋转角度（根据速度）
            fish.rotation = Math.min(Math.max(fish.vy * 0.05, -0.4), 0.5);

            // 边界碰撞
            if (fish.y - fish.radius < 0 || fish.y + fish.radius > canvas.height) {
                gameOver();
            }

            // 生成障碍物（珊瑚）
            if (frameCount % spawnInterval === 0) {
                let gap = 140; // 缝隙大小
                let topHeight = Math.random() * (canvas.height - gap - 100) + 50;
                
                obstacles.push({
                    x: canvas.width,
                    topHeight: topHeight,
                    bottomY: topHeight + gap,
                    width: 50,
                    passed: false
                });

                // 在缝隙中生成白饭
                riceGrains.push({
                    x: canvas.width + 25,
                    y: topHeight + gap / 2 + (Math.random() * 40 - 20),
                    radius: 8,
                    collected: false
                });
            }

            // 移动障碍物
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= 2; // 移动速度
                
                // 碰撞检测（矩形与圆）
                let fishLeft = fish.x - fish.radius;
                let fishRight = fish.x + fish.radius;
                let fishTop = fish.y - fish.radius;
                let fishBottom = fish.y + fish.radius;

                if (fishRight > obs.x && fishLeft < obs.x + obs.width) {
                    if (fishTop < obs.topHeight || fishBottom > obs.bottomY) {
                        gameOver();
                    }
                }

                // 加分（穿过）
                if (!obs.passed && obs.x + obs.width < fish.x - fish.radius) {
                    obs.passed = true;
                    score += 1;
                    scoreBoard.innerText = `得分: ${score}`;
                }

                // 移除出界的障碍物
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // 移动白饭
            for (let i = riceGrains.length - 1; i >= 0; i--) {
                let rice = riceGrains[i];
                rice.x -= 2;

                // 碰撞检测（圆与圆）
                if (!rice.collected) {
                    let dx = fish.x - rice.x;
                    let dy = fish.y - rice.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < fish.radius + rice.radius) {
                        rice.collected = true;
                        score += 5;
                        scoreBoard.innerText = `得分: ${score}`;
                    }
                }

                if (rice.x + rice.radius < 0) {
                    riceGrains.splice(i, 1);
                }
            }

            // 更新气泡
            bubbles.forEach(b => {
                b.y -= b.speed;
                if (b.y < 0) {
                    b.y = canvas.height;
                    b.x = Math.random() * canvas.width;
                }
            });
        }

        draw();
        requestAnimationFrame(update);
    }

    function gameOver() {
        gameState = 'over';
        finalScoreEl.innerText = `最终得分: ${score}`;
        overOverlay.style.display = 'flex';
    }

    // 绘制
    function draw() {
        // 绘制海底背景渐变（在CSS里做了，但canvas里也可以补一点深色底）
        ctx.fillStyle = '#0b1d3a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 绘制海底光线
        ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.beginPath();
        ctx.moveTo(canvas.width * 0.2, 0);
        ctx.lineTo(canvas.width * 0.5, canvas.height);
        ctx.lineTo(canvas.width * 0.8, canvas.height);
        ctx.lineTo(canvas.width * 0.5, 0);
        ctx.fill();

        // 绘制气泡
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1;
        bubbles.forEach(b => {
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
            ctx.stroke();
        });

        // 绘制珊瑚/礁石（障碍物）
        obstacles.forEach(obs => {
            // 顶部珊瑚
            drawCoral(obs.x, 0, obs.width, obs.topHeight, true);
            // 底部珊瑚
            drawCoral(obs.x, obs.bottomY, obs.width, canvas.height - obs.bottomY, false);
        });

        // 绘制白饭
        riceGrains.forEach(rice => {
            if (!rice.collected) {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(rice.x, rice.y, rice.radius, 0, Math.PI * 2);
                ctx.fill();
                // 加一点米粒的高光
                ctx.fillStyle = 'rgba(200, 230, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(rice.x - 2, rice.y - 2, rice.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        // 绘制大肥鱼（小鸟位置）
        if (gameState !== 'idle') {
            drawFish(fish.x, fish.y, fish.radius, fish.rotation);
        }
    }

    // 画珊瑚
    function drawCoral(x, y, w, h, isTop) {
        // 珊瑚主体颜色
        ctx.fillStyle = isTop ? '#ff6b6b' : '#4ecdc4'; // 顶部粉红珊瑚，底部青色礁石
        ctx.beginPath();
        // 画成有点凹凸不平的柱子
        ctx.roundRect(x, y, w, h, [10]);
        ctx.fill();

        // 珊瑚纹理
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        if (isTop) {
            ctx.fillRect(x + 10, y + 10, 10, h - 20);
            ctx.fillRect(x + 30, y + 30, 8, h - 40);
        } else {
            ctx.fillRect(x + 10, y + 10, 10, h - 20);
            ctx.fillRect(x + 30, y + 20, 8, h - 30);
        }

        // 珊瑚分支（画几个小圆点装饰）
        ctx.fillStyle = isTop ? '#ff9f9f' : '#85e3dd';
        for (let i = 0; i < h; i += 30) {
            ctx.beginPath();
            ctx.arc(x + (isTop ? w : 0), y + i, 6, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // 画大肥鱼
    function drawFish(x, y, r, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);

        // 鱼身（蓝色圆球）
        ctx.fillStyle = '#5b9bd5';
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        // 鲸鱼鳍耳（三角形）
        ctx.fillStyle = '#3b4654';
        // 上鳍
        ctx.beginPath();
        ctx.moveTo(-r * 0.5, -r * 0.8);
        ctx.lineTo(-r * 1.2, -r * 1.3);
        ctx.lineTo(0, -r * 0.5);
        ctx.fill();
        // 下鳍
        ctx.beginPath();
        ctx.moveTo(-r * 0.5, r * 0.8);
        ctx.lineTo(-r * 1.2, r * 1.3);
        ctx.lineTo(0, r * 0.5);
        ctx.fill();

        // 尾巴
        ctx.fillStyle = '#4a8ab5';
        ctx.beginPath();
        ctx.moveTo(-r, 0);
        ctx.lineTo(-r * 1.6, -r * 0.5);
        ctx.lineTo(-r * 1.6, r * 0.5);
        ctx.closePath();
        ctx.fill();

        // 眼睛
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(r * 0.3, -r * 0.2, r * 0.3, 0, Math.PI * 2);
        ctx.fill();
        // 瞳孔
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(r * 0.4, -r * 0.2, r * 0.15, 0, Math.PI * 2);
        ctx.fill();

        // 腮红（可爱一点）
        ctx.fillStyle = 'rgba(255, 100, 100, 0.4)';
        ctx.beginPath();
        ctx.arc(r * 0.1, r * 0.3, r * 0.25, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    // 兼容旧浏览器的圆角矩形
    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.beginPath();
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            this.closePath();
            return this;
        };
    }

    // 启动游戏循环
    update();
</script>
</body>
</html>
