<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 丝滑动画版</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #faf8ef;
            color: #776e65;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            touch-action: none;
        }

        .game-container {
            width: 90%;
            max-width: 480px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 { font-size: 48px; margin: 0; }

        .score-box {
            background-color: #bbada0;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-title { font-size: 12px; color: #eee4da; margin-bottom: 4px; }

        .btn-group {
            display: flex; gap: 8px;
        }

        .btn {
            background-color: #8f7a66;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-erase { background-color: #f0a000; }
        .btn-erase:active { background-color: #c08000; }

        .grid-container {
            position: relative;
            background-color: #bbada0;
            border-radius: 10px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            aspect-ratio: 1 / 1;
        }

        /* 背景格子：只留颜色，不存数字 */
        .grid-cell {
            background-color: rgba(238, 228, 218, 0.35);
            border-radius: 6px;
        }

        /* 方块层 */
        .tile-container {
            position: absolute;
            top: 10px;
            left: 10px;
            width: calc(100% - 20px);
            height: calc(100% - 20px);
            pointer-events: none;
        }

        .tile {
            position: absolute;
            width: calc((100% - 30px) / 4);
            height: calc((100% - 30px) / 4);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
            transition: transform 0.1s ease-in-out;
            will-change: transform;
        }

        /* 数字颜色配置 */
        .tile-2 { background-color: #eee4da; color: #776e65; }
        .tile-4 { background-color: #ede0c8; color: #776e65; }
        .tile-8 { background-color: #f2b179; color: #f9f6f2; }
        .tile-16 { background-color: #f59563; color: #f9f6f2; }
        .tile-32 { background-color: #f67c5f; color: #f9f6f2; }
        .tile-64 { background-color: #f65e3b; color: #f9f6f2; }
        .tile-128 { background-color: #edcf72; color: #f9f6f2; font-size: 30px; }
        .tile-256 { background-color: #edcc61; color: #f9f6f2; font-size: 30px; }
        .tile-512 { background-color: #edc850; color: #f9f6f2; font-size: 30px; }
        .tile-1024 { background-color: #edc53f; color: #f9f6f2; font-size: 25px; }
        .tile-2048 { background-color: #edc22e; color: #f9f6f2; font-size: 25px; box-shadow: 0 0 20px rgba(237, 194, 46, 0.5); }
        .tile-super { background-color: #3c3a32; color: #f9f6f2; font-size: 20px; }

        /* 原有动画 */
        @keyframes appear { 0% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes pop { 0% { box-shadow: 0 0 0 rgba(255,255,255,0); } 50% { box-shadow: 0 0 20px rgba(255,255,255,0.8); } 100% { box-shadow: 0 0 0 rgba(255,255,255,0); } }
        
        /* ★★★ 新增：消除时的动画（原地缩小消失，不旋转） ★★★ */
        @keyframes erase { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
        .tile-erased { animation: erase 0.3s ease-out forwards; z-index: 10; }

        .tile-new { animation: appear 0.2s ease-out; }
        .tile-merged { animation: pop 0.2s ease-in-out; }

        .game-over {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(238, 228, 218, 0.85);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }
        .game-over h2 { font-size: 40px; margin-bottom: 10px; color: #776e65; }
        .game-over p { font-size: 18px; font-weight: bold; color: #f65e3b; margin-bottom: 25px; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <h1>2048</h1>
            <div class="score-box">
                <span class="score-title">得分</span>
                <span id="score">0</span>
            </div>
            <div class="btn-group">
                <button class="btn btn-erase" id="erase-btn">消除最大</button>
                <button class="btn" id="restart-btn">重开</button>
            </div>
        </div>

        <div class="grid-container" id="grid">
            <!-- 背景网格 -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            
            <!-- 方块容器 -->
            <div class="tile-container" id="tile-container"></div>

            <!-- 游戏结束遮罩 -->
            <div class="game-over" id="game-over">
                <h2>游戏结束</h2>
                <p>菜就多练</p>
                <button id="retry-btn" style="background:#8f7a66; color:white; border:none; padding:10px 20px; border-radius:6px; font-size:16px; cursor:pointer;">再来一局</button>
            </div>
        </div>
    </div>

    <script>
        const gridSize = 4;
        let board = [];  
        let score = 0;
        let isGameOver = false;
        let isAnimating = false; 
        let tileIdCounter = 0;
        let tileElements = new Map(); 

        const scoreDisplay = document.getElementById('score');
        const gameOverOverlay = document.getElementById('game-over');
        const restartBtn = document.getElementById('restart-btn');
        const retryBtn = document.getElementById('retry-btn');
        const eraseBtn = document.getElementById('erase-btn');
        const tileContainer = document.getElementById('tile-container');

        function initGame() {
            clearGame();
            board = Array.from({ length: gridSize }, () => Array(gridSize).fill(null));
            score = 0;
            isGameOver = false;
            isAnimating = false;
            tileIdCounter = 0;
            tileElements.clear();
            tileContainer.innerHTML = '';
            
            gameOverOverlay.style.display = 'none';
            updateScore(0);
            addRandomTile();
            addRandomTile();
            renderBoard();
        }

        function addRandomTile() {
            let emptyCells = [];
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    if (board[r][c] === null) emptyCells.push({ r, c });
                }
            }
            if (emptyCells.length > 0) {
                let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[randomCell.r][randomCell.c] = { 
                    id: ++tileIdCounter, 
                    value: Math.random() < 0.9 ? 2 : 4, 
                    isNew: true, 
                    isMerged: false 
                };
            }
        }

        function renderBoard(deadIds = []) {
            const activeIds = new Set();

            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    let cellData = board[r][c];
                    if (!cellData) continue;
                    
                    activeIds.add(cellData.id);
                    let tile = tileElements.get(cellData.id);

                    if (!tile) {
                        tile = document.createElement('div');
                        tile.className = `tile tile-${cellData.value}`;
                        if (cellData.isNew) tile.classList.add('tile-new');
                        tile.textContent = cellData.value;
                        tile.style.transform = `translate(calc(${c * 100}% + ${c * 10}px), calc(${r * 100}% + ${r * 10}px))`;
                        tileElements.set(cellData.id, tile);
                        tileContainer.appendChild(tile);
                    } else {
                        tile.textContent = cellData.value;
                        tile.className = `tile tile-${cellData.value}`;
                        if (cellData.isMerged) tile.classList.add('tile-merged');
                        tile.style.transform = `translate(calc(${c * 100}% + ${c * 10}px), calc(${r * 100}% + ${r * 10}px))`;
                    }
                    
                    if (cellData.isNew) {
                        setTimeout(() => { tile.classList.remove('tile-new'); }, 200);
                        cellData.isNew = false;
                    }
                    if (cellData.isMerged) {
                        setTimeout(() => { tile.classList.remove('tile-merged'); }, 200);
                        cellData.isMerged = false;
                    }
                }
            }

            deadIds.forEach(id => {
                let tile = tileElements.get(id);
                if (tile) {
                    tile.remove();
                    tileElements.delete(id);
                }
            });
        }

        function updateScore(points) {
            score += points;
            scoreDisplay.textContent = score;
        }

        function move(direction) {
            if (isGameOver || isAnimating) return;
            isAnimating = true;
            
            let moved = false;
            let newBoard = Array.from({ length: gridSize }, () => Array(gridSize).fill(null));
            let deadIds = []; 

            const getLine = (index) => {
                let line = [];
                for (let i = 0; i < gridSize; i++) {
                    if (direction === 'left') line.push(board[index][i]);
                    if (direction === 'right') line.push(board[index][gridSize - 1 - i]);
                    if (direction === 'up') line.push(board[i][index]);
                    if (direction === 'down') line.push(board[gridSize - 1 - i][index]);
                }
                return line;
            };

            const setLine = (index, line) => {
                for (let i = 0; i < gridSize; i++) {
                    if (direction === 'left') newBoard[index][i] = line[i];
                    if (direction === 'right') newBoard[index][gridSize - 1 - i] = line[i];
                    if (direction === 'up') newBoard[i][index] = line[i];
                    if (direction === 'down') newBoard[gridSize - 1 - i][index] = line[i];
                }
            };

            for (let i = 0; i < gridSize; i++) {
                let line = getLine(i);
                let filteredLine = line.filter(val => val !== null); 
                let newLine = [];
                let addedPoints = 0;

                for (let j = 0; j < filteredLine.length; j++) {
                    if (j < filteredLine.length - 1 && filteredLine[j].value === filteredLine[j + 1].value) {
                        let mergedValue = filteredLine[j].value * 2;
                        newLine.push({ id: filteredLine[j].id, value: mergedValue, isNew: false, isMerged: true });
                        deadIds.push(filteredLine[j + 1].id);
                        addedPoints += mergedValue;
                        j++; 
                    } else {
                        newLine.push(filteredLine[j]);
                    }
                }

                while (newLine.length < gridSize) newLine.push(null);

                let oldVals = line.map(item => item ? item.value : 0).join(',');
                let newVals = newLine.map(item => item ? item.value : 0).join(',');
                if (oldVals !== newVals) moved = true;

                setLine(i, newLine);
                if (addedPoints > 0) updateScore(addedPoints);
            }

            if (moved) {
                board = newBoard;
                addRandomTile();
                renderBoard(deadIds);
                checkGameOver();
                saveGame();
            }
            
            setTimeout(() => { isAnimating = false; }, 150);
        }

        // ★★★ 新增功能：无限次消除最大方块（简约缩小消失动画） ★★★
        function eraseLargestTile() {
            if (isGameOver || isAnimating) return;

            // 1. 找到当前棋盘上的最大数值
            let maxVal = 0;
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    if (board[r][c] && board[r][c].value > maxVal) {
                        maxVal = board[r][c].value;
                    }
                }
            }

            if (maxVal === 0) return; 

            // 2. 找到所有数值等于最大值的方块
            let candidates = [];
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    if (board[r][c] && board[r][c].value === maxVal) {
                        candidates.push({ r, c });
                    }
                }
            }

            // 3. 随机选择一个
            let target = candidates[Math.floor(Math.random() * candidates.length)];
            let targetId = board[target.r][target.c].id;

            isAnimating = true;
            
            // 4. 播放“原地缩小消失”的动画
            let tile = tileElements.get(targetId);
            if (tile) {
                tile.classList.add('tile-erased');
            }

            // 5. 延迟 300ms 等动画播完，再更新数据和棋盘
            setTimeout(() => {
                board[target.r][target.c] = null;
                
                let oldTile = tileElements.get(targetId);
                if (oldTile) {
                    oldTile.remove();
                    tileElements.delete(targetId);
                }

                // 6. 补充一个随机方块（保证游戏能继续）
                addRandomTile();
                
                renderBoard();
                checkGameOver();
                saveGame();
                isAnimating = false;
            }, 300);
        }

        function checkGameOver() {
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    if (board[r][c] === null) return;
                }
            }
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    let val = board[r][c].value;
                    if (c < gridSize - 1 && val === board[r][c + 1].value) return;
                    if (r < gridSize - 1 && val === board[r + 1][c].value) return;
                }
            }
            isGameOver = true;
            gameOverOverlay.style.display = 'flex';
        }

        function saveGame() {
            try {
                const saveData = {
                    board: board,
                    score: score,
                    tileIdCounter: tileIdCounter
                };
                localStorage.setItem('game2048_save', JSON.stringify(saveData));
            } catch (e) { console.log('保存失败', e); }
        }

        function loadGame() {
            try {
                const saved = localStorage.getItem('game2048_save');
                if (saved) {
                    const data = JSON.parse(saved);
                    board = data.board;
                    score = data.score;
                    tileIdCounter = data.tileIdCounter;
                    
                    for (let r = 0; r < gridSize; r++) {
                        for (let c = 0; c < gridSize; c++) {
                            if (board[r][c]) {
                                board[r][c].isNew = false;
                                board[r][c].isMerged = false;
                            }
                        }
                    }
                    
                    updateScore(0); 
                    scoreDisplay.textContent = score;
                    gameOverOverlay.style.display = 'none';
                    renderBoard();
                    checkGameOver();
                    return true;
                }
            } catch (e) { console.log('读取失败', e); }
            return false;
        }

        function clearGame() {
            try { localStorage.removeItem('game2048_save'); } catch (e) {}
        }

        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
                if (e.key === 'ArrowUp') move('up');
                if (e.key === 'ArrowDown') move('down');
                if (e.key === 'ArrowLeft') move('left');
                if (e.key === 'ArrowRight') move('right');
            }
        });

        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            let dx = e.changedTouches[0].clientX - touchStartX;
            let dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    move(dx > 0 ? 'right' : 'left');
                } else {
                    move(dy > 0 ? 'down' : 'up');
                }
            }
        }, { passive: true });

        restartBtn.addEventListener('click', initGame);
        retryBtn.addEventListener('click', initGame);
        
        // 绑定消除按钮，阻止事件穿透（避免触发滑动）
        eraseBtn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); eraseLargestTile(); });
        eraseBtn.addEventListener('click', (e) => { e.stopPropagation(); eraseLargestTile(); });

        if (!loadGame()) {
            initGame();
        }
    </script>
</body>
</html>
