<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>俄罗斯方块</title>
    <style>
        /* 全局变量：默认主题（粉红） */
        :root {
            --bg-color: #ffe6e6;
            --panel-bg: #ffcccc;
            --text-color: #663333;
            --btn-bg: #ffb3b3;
            --btn-active: #ff9999;
            --btn-text: #ffffff;
            --canvas-bg: #fff0f0;
            --canvas-grid: #ffe0e0;
            --rotate-bg: #d970ff;
            --drop-bg: #00bcd4;
            --shadow-color: rgba(0,0,0,0.1);
        }
        /* 主题：粉蓝 */
        body.theme-blue {
            --bg-color: #e6f2ff;
            --panel-bg: #cce6ff;
            --text-color: #334d66;
            --btn-bg: #99ccff;
            --btn-active: #80b3ff;
            --btn-text: #ffffff;
            --canvas-bg: #f0f8ff;
            --canvas-grid: #e0f0ff;
            --rotate-bg: #66b3ff;
            --drop-bg: #00bcd4;
            --shadow-color: rgba(0,0,0,0.1);
        }
        /* 主题：粉绿 */
        body.theme-green {
            --bg-color: #e6ffe6;
            --panel-bg: #ccffcc;
            --text-color: #336633;
            --btn-bg: #99ff99;
            --btn-active: #80e680;
            --btn-text: #ffffff;
            --canvas-bg: #f0fff0;
            --canvas-grid: #e0ffe0;
            --rotate-bg: #66ff66;
            --drop-bg: #00bcd4;
            --shadow-color: rgba(0,0,0,0.1);
        }
        /* 主题：粉黄 */
        body.theme-yellow {
            --bg-color: #ffffe6;
            --panel-bg: #ffffcc;
            --text-color: #666633;
            --btn-bg: #ffff99;
            --btn-active: #ffff80;
            --btn-text: #665500;
            --canvas-bg: #fffff0;
            --canvas-grid: #ffffe0;
            --rotate-bg: #ffcc00;
            --drop-bg: #00bcd4;
            --shadow-color: rgba(0,0,0,0.1);
        }

        body {
            background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100dvh; margin: 0; padding: 10px; box-sizing: border-box;
            overflow-y: auto; touch-action: none; transition: background-color 0.3s;
        }
        .game-container {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 400px; box-sizing: border-box;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; margin-bottom: 10px; font-size: 18px; font-weight: bold;
        }
        .score-box {
            background: var(--panel-bg); padding: 5px 15px; border-radius: 8px;
            font-size: 20px; font-weight: bold; color: #ff9900;
            border: 2px solid var(--btn-bg); transition: background-color 0.3s;
        }
        
        /* 核心布局：左中右三明治 */
        .main-play-area {
            display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%;
        }
        .sidebar {
            display: flex; flex-direction: column; gap: 10px; justify-content: center;
        }
        .sidebar.left {
            /* 难度 */
            align-items: flex-start;
        }
        .sidebar.right {
            /* 主题 */
            align-items: flex-end;
        }
        
        canvas {
            background-color: var(--canvas-bg); border-radius: 8px;
            box-shadow: inset 0 0 10px var(--shadow-color);
            height: 50dvh; width: auto; max-width: 100%; aspect-ratio: 1 / 2;
            transition: background-color 0.3s;
        }
        
        /* 小圆圈主题按钮 */
        .theme-dot {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .theme-dot.active { border-color: #333; transform: scale(1.1); }
        .dot-pink { background: #ffcccc; }
        .dot-blue { background: #cce6ff; }
        .dot-green { background: #ccffcc; }
        .dot-yellow { background: #ffffcc; }

        /* 统一按钮样式 */
        .btn {
            background: var(--btn-bg); border: none; border-radius: 8px; color: var(--btn-text);
            font-size: 16px; font-weight: bold; 
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; user-select: none; 
            box-shadow: 0 4px 0 var(--btn-active); transition: all 0.1s;
            width: 100%; padding: 10px 0;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--btn-active); }
        
        .btn.rotate { background: var(--rotate-bg); }
        .btn.drop { background: var(--drop-bg); color: white; }
        .btn.restart { background: #ff6666; color: white; }
        .btn.pause { background: #ffb366; color: white; }
        
        /* 工字形底部控制区 */
        .controls-bottom {
            display: flex; flex-direction: column; gap: 8px;
            width: 100%; margin-top: 10px;
        }
        .row-rotate { display: flex; justify-content: center; }
        .row-rotate .btn { width: 50%; }
        
        .row-arrows { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .row-arrows .btn { min-height: 55px; font-size: 22px; }
        
        .row-drop { display: flex; }

        /* 顶部按钮 */
        .header-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 5px; }
    </style>
</head>
<body class="theme-pink">

<div class="game-container">
    <div class="header">
        <div>分数:</div>
        <div class="score-box" id="score">0</div>
    </div>
    
    <!-- 顶部按钮区 -->
    <div class="header-btns">
        <button class="btn restart" id="btnRestart">重新开始</button>
        <button class="btn pause" id="btnPause">暂停</button>
    </div>

    <!-- 主体区域：左难度，中画布，右主题 -->
    <div class="main-play-area">
        <div class="sidebar left">
            <div style="font-size:12px; font-weight:bold; margin-bottom:5px;">难度</div>
            <button class="btn" id="btnSpeed" style="padding: 15px 5px; font-size: 14px;">普通</button>
        </div>
        
        <canvas id="gameCanvas" width="300" height="600"></canvas>
        
        <div class="sidebar right">
            <div style="font-size:12px; font-weight:bold; margin-bottom:5px;">主题</div>
            <div class="theme-dot dot-pink active" data-theme="theme-pink"></div>
            <div class="theme-dot dot-blue" data-theme="theme-blue"></div>
            <div class="theme-dot dot-green" data-theme="theme-green"></div>
            <div class="theme-dot dot-yellow" data-theme="theme-yellow"></div>
        </div>
    </div>

    <!-- 底部工字形控制区 -->
    <div class="controls-bottom">
        <!-- 第一行：旋转 -->
        <div class="row-rotate">
            <button class="btn rotate" id="btnUp">↻ 旋转</button>
        </div>
        <!-- 第二行：左中右 -->
        <div class="row-arrows">
            <button class="btn left" id="btnLeft">←</button>
            <button class="btn down" id="btnDown">↓</button>
            <button class="btn right" id="btnRight">→</button>
        </div>
        <!-- 第三行：一键直落 -->
        <div class="row-drop">
            <button class="btn drop" id="btnDrop">⇓ 一键直落到底</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const btnPause = document.getElementById('btnPause');
    const btnSpeed = document.getElementById('btnSpeed');

    const COLS = 10, ROWS = 20, BLOCK_SIZE = 30;
    let board = [];
    let score = 0;
    let gameState = 'idle'; // idle, running, paused, over
    let currentPiece = null;
    let dropCounter = 0;
    let lastTime = 0;

    // 难度系统
    const SPEEDS = [800, 500, 200, 100];
    const SPEED_LABELS = ["慢速", "普通", "快速", "极速"];
    let speedIndex = 1;
    let dropInterval = SPEEDS[speedIndex];

    // 方块颜色（不受主题影响，保持高对比度）
    const PIECES = [
        { shape: [[1, 1, 1, 1]], color: '#00f0f0' },
        { shape: [[1, 1, 1], [0, 1, 0]], color: '#a000f0' },
        { shape: [[1, 1, 1], [1, 0, 0]], color: '#f0a000' },
        { shape: [[1, 1, 1], [0, 0, 1]], color: '#0000f0' },
        { shape: [[1, 1], [1, 1]], color: '#f0f000' },
        { shape: [[0, 1, 1], [1, 1, 0]], color: '#00f000' },
        { shape: [[1, 1, 0], [0, 1, 1]], color: '#f00000' }
    ];

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) { matrix.push(new Array(w).fill(0)); }
        return matrix;
    }

    function getRandomPiece() {
        const p = PIECES[Math.floor(Math.random() * PIECES.length)];
        return {
            shape: p.shape.map(row => [...row]),
            color: p.color,
            x: Math.floor(COLS / 2) - Math.ceil(p.shape[0].length / 2),
            y: 0
        };
    }

    function collide(board, piece) {
        const { shape, x, y } = piece;
        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[r].length; c++) {
                if (shape[r][c] !== 0) {
                    const newX = x + c, newY = y + r;
                    if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                    if (newY >= 0 && board[newY][newX] !== 0) return true;
                }
            }
        }
        return false;
    }

    function merge(board, piece) {
        piece.shape.forEach((row, r) => {
            row.forEach((value, c) => {
                if (value !== 0) {
                    const newY = piece.y + r, newX = piece.x + c;
                    if (newY >= 0) board[newY][newX] = piece.color;
                }
            });
        });
    }

    function rotate(matrix) {
        const N = matrix.length;
        const result = matrix[0].map((_, i) => matrix.map(row => row[i]));
        return result.map(row => row.reverse());
    }

    function playerRotate() {
        if (gameState !== 'running') return;
        const rotated = rotate(currentPiece.shape);
        const posX = currentPiece.x;
        let offset = 1;
        while (collide(board, { shape: rotated, x: currentPiece.x, y: currentPiece.y })) {
            currentPiece.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (Math.abs(offset) > currentPiece.shape[0].length) {
                currentPiece.x = posX; return;
            }
        }
        currentPiece.shape = rotated;
    }

    function playerDrop() {
        if (gameState !== 'running') return;
        currentPiece.y++;
        if (collide(board, currentPiece)) {
            currentPiece.y--;
            merge(board, currentPiece);
            clearLines();
            currentPiece = getRandomPiece();
            if (collide(board, currentPiece)) {
                gameState = 'over';
            }
        }
        dropCounter = 0;
    }

    function playerHardDrop() {
        if (gameState !== 'running') return;
        while (!collide(board, currentPiece)) currentPiece.y++;
        currentPiece.y--;
        playerDrop();
    }

    function playerMove(dir) {
        if (gameState !== 'running') return;
        currentPiece.x += dir;
        if (collide(board, currentPiece)) currentPiece.x -= dir;
    }

    function clearLines() {
        let linesCleared = 0;
        outer: for (let y = ROWS - 1; y >= 0; y--) {
            for (let x = 0; x < COLS; x++) {
                if (board[y][x] === 0) continue outer;
            }
            board.splice(y, 1);
            board.unshift(new Array(COLS).fill(0));
            linesCleared++;
            y++;
        }
        if (linesCleared > 0) {
            score += [0, 100, 300, 500, 800][linesCleared] || 0;
            scoreElement.innerText = score;
        }
    }

    function draw() {
        // 获取当前主题的画布背景色
        const style = getComputedStyle(document.body);
        const canvasBg = style.getPropertyValue('--canvas-bg').trim();
        const gridColor = style.getPropertyValue('--canvas-grid').trim();
        const shadowColor = style.getPropertyValue('--shadow-color').trim();

        ctx.fillStyle = canvasBg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = gridColor;
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= COLS; i++) { ctx.beginPath(); ctx.moveTo(i * BLOCK_SIZE, 0); ctx.lineTo(i * BLOCK_SIZE, canvas.height); ctx.stroke(); }
        for (let j = 0; j <= ROWS; j++) { ctx.beginPath(); ctx.moveTo(0, j * BLOCK_SIZE); ctx.lineTo(canvas.width, j * BLOCK_SIZE); ctx.stroke(); }

        board.forEach((row, y) => { row.forEach((value, x) => { if (value !== 0) drawBlock(x, y, value); }); });

        if (currentPiece) {
            currentPiece.shape.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value !== 0) drawBlock(currentPiece.x + c, currentPiece.y + r, currentPiece.color);
                });
            });
        }

        if (gameState === 'over') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff4d4d'; ctx.font = 'bold 30px Arial'; ctx.textAlign = 'center';
            ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillStyle = '#333'; ctx.font = '16px Arial';
            ctx.fillText('点击上方"重新开始"', canvas.width / 2, canvas.height / 2 + 20);
        } else if (gameState === 'paused') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#5b9bd5'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center';
            ctx.fillText('已暂停', canvas.width / 2, canvas.height / 2);
        } else if (gameState === 'idle') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#5b9bd5'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center';
            ctx.fillText('准备好了吗？', canvas.width / 2, canvas.height / 2 - 10);
            ctx.fillStyle = '#333'; ctx.font = '16px Arial';
            ctx.fillText('点击上方"重新开始"', canvas.width / 2, canvas.height / 2 + 20);
        }
    }

    function drawBlock(x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, 5);
        ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, 5, BLOCK_SIZE - 1);
    }

    function update(time = 0) {
        if (gameState !== 'running') {
            draw();
            requestAnimationFrame(update);
            return;
        }
        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) playerDrop();
        draw();
        requestAnimationFrame(update);
    }

    function resetGame() {
        board = createMatrix(COLS, ROWS);
        score = 0; scoreElement.innerText = score;
        gameState = 'running';
        currentPiece = getRandomPiece();
        dropCounter = 0; lastTime = performance.now();
        btnPause.innerText = '暂停';
        btnPause.style.background = '#ffb366';
        btnPause.style.color = 'white';
        draw();
    }

    // 按钮事件绑定
    document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); playerMove(-1); });
    document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); playerMove(1); });
    document.getElementById('btnUp').addEventListener('touchstart', (e) => { e.preventDefault(); playerRotate(); });
    document.getElementById('btnDrop').addEventListener('touchstart', (e) => { e.preventDefault(); playerHardDrop(); });
    document.getElementById('btnRestart').addEventListener('click', resetGame);

    // 长按“下键”硬降逻辑
    let downTimer = null;
    let isLongPress = false;
    const btnDown = document.getElementById('btnDown');
    
    btnDown.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (gameState !== 'running') return;
        isLongPress = false;
        downTimer = setTimeout(() => {
            isLongPress = true;
            playerHardDrop();
        }, 300);
    });

    btnDown.addEventListener('touchend', (e) => {
        e.preventDefault();
        clearTimeout(downTimer);
        if (!isLongPress && gameState === 'running') {
            playerDrop();
        }
    });

    // 暂停逻辑
    btnPause.addEventListener('click', () => {
        if (gameState === 'over' || gameState === 'idle') return;
        if (gameState === 'running') {
            gameState = 'paused';
            btnPause.innerText = '继续';
            btnPause.style.background = '#66cc66';
            btnPause.style.color = 'white';
        } else if (gameState === 'paused') {
            gameState = 'running';
            btnPause.innerText = '暂停';
            btnPause.style.background = '#ffb366';
            btnPause.style.color = 'white';
            lastTime = performance.now();
            update();
        }
    });

    // 难度切换逻辑
    btnSpeed.addEventListener('click', () => {
        speedIndex = (speedIndex + 1) % SPEEDS.length;
        dropInterval = SPEEDS[speedIndex];
        btnSpeed.innerText = SPEED_LABELS[speedIndex];
    });

    // 主题切换逻辑
    const themeDots = document.querySelectorAll('.theme-dot');
    themeDots.forEach(dot => {
        dot.addEventListener('click', () => {
            // 移除其他active
            themeDots.forEach(d => d.classList.remove('active'));
            // 添加当前active
            dot.classList.add('active');
            // 切换body主题
            document.body.className = dot.dataset.theme;
        });
    });

    // 键盘控制（电脑端备用）
    document.addEventListener('keydown', e => {
        if (gameState === 'over') { if (e.key === 'r' || e.key === 'R') resetGame(); return; }
        if (e.key === 'p' || e.key === 'P') { btnPause.click(); e.preventDefault(); return; }
        if (gameState !== 'running') return;
        if (e.key === 'ArrowLeft') { playerMove(-1); e.preventDefault(); }
        else if (e.key === 'ArrowRight') { playerMove(1); e.preventDefault(); }
        else if (e.key === 'ArrowDown') { playerDrop(); e.preventDefault(); }
        else if (e.key === 'ArrowUp') { playerRotate(); e.preventDefault(); }
        else if (e.key === ' ') { playerHardDrop(); e.preventDefault(); }
    });

    // 初始化游戏并开始循环
    resetGame();
    update();
</script>
</body>
</html>
